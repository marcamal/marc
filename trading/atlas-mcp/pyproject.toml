[project]
name = "atlas-mcp"
version = "0.1.0"
description = "MCP bridge to a local ATLAS trading system: read-only, plus an emergency stop."
requires-python = ">=3.12"
dependencies = ["mcp>=2.3", "httpx>=0.27"]

[project.scripts]
atlas-mcp = "atlas_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter

    # `NotPermitted` and `AtlasUnreachable` describe a refusal and a missing
    # service. They read better at the call site than the "...Error" forms, and
    # the backend ignores N818 for `OrderRejected` and `DuplicateOrder` for the
    # same reason.
    "N818",
]

[tool.ruff.format]
quote-style = "double"
