# Alembic configuration.
#
# The MVP creates tables with `create_all` at startup, which is right while the
# schema is still settling. Alembic is configured and ready for the moment the
# schema has to change under real data — at that point, generate the first
# revision with:
#
#     alembic revision --autogenerate -m "describe the change"
#     alembic upgrade head
#
# The database URL is read from ATLAS_DATABASE_URL at runtime (see env.py),
# so it is deliberately left blank here and never hard-codes a credential.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
